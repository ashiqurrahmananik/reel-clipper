[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reel-clipper"
version = "0.1.0"
description = "Turn long YouTube videos into vertical, captioned reels with a CLI and local web UI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ashiqur Rahman Anik" }]
keywords = ["youtube", "shorts", "reels", "tiktok", "ffmpeg", "yt-dlp", "clip"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "yt-dlp>=2025.1.1",
  "Flask>=3.0",
]

[project.optional-dependencies]
whisper = [
  "faster-whisper>=1.1.0",
  "av>=11,<18",
]

[project.scripts]
reel-clipper = "clipmaker.cli:main"

[project.urls]
Homepage = "https://github.com/ashiqurrahmananik/reel-clipper"
Source = "https://github.com/ashiqurrahmananik/reel-clipper"
Issues = "https://github.com/ashiqurrahmananik/reel-clipper/issues"

[tool.setuptools]
packages = ["clipmaker"]

[tool.setuptools.package-data]
clipmaker = ["web/templates/*.html"]
